[project]
name = "coverage-assistant"
version = "0.1.0"
description = "Asistente inteligente para validación de cobertura de planes de salud mediante RAG"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "openai>=1.40",
    "chromadb>=0.5",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
]

# Reglas de importación entre capas (§2.3, §14.1):
# Presentation → Application → Domain ← Infrastructure
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"fastapi".msg = "FastAPI solo puede usarse en app/presentation (§5.3)."
"openai".msg = "OpenAI SDK solo puede usarse en app/infrastructure (§5.16)."
"chromadb".msg = "ChromaDB solo puede usarse en app/infrastructure/vectorstore (§5.8)."
"pandas".msg = "Pandas solo puede usarse en app/infrastructure/repositories (§5.10)."
"docx".msg = "python-docx solo puede usarse en app/infrastructure/document_loader (§5.9)."

[tool.ruff.lint.per-file-ignores]
# Los prompts son contenido en lenguaje natural: la longitud de línea
# no aplica como regla de código (§8: los prompts son software, pero su
# legibilidad se rige por el texto, no por PEP 8).
"app/application/prompts/**" = ["E501"]
"app/presentation/**" = ["TID251"]
"app/infrastructure/**" = ["TID251"]
"app/main.py" = ["TID251"]
"tests/**" = ["TID251"]
"scripts/**" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
packages = ["app"]
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["chromadb.*", "docx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: pruebas unitarias",
    "integration: pruebas de integración entre componentes",
    "e2e: pruebas de flujo completo",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py"]
